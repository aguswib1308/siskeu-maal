# /etc/nginx/sites-available/bmt-maal
# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name maal.DOMAINBMT.com;
    return 301 https://$host$request_uri;
}

# ── Fallback: akses via IP tetap jalan (tanpa SSL) ──────────────────────────
server {
    listen 8080;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/bmt-maal/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60;
    }
}

# ── HTTPS (aktifkan setelah certbot selesai) ─────────────────────────────────
server {
    listen 443 ssl http2;
    server_name maal.DOMAINBMT.com;

    ssl_certificate /etc/letsencrypt/live/maal.DOMAINBMT.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maal.DOMAINBMT.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Static files — long cache, immutable
    location /static/ {
        alias /var/www/bmt-maal/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Digital Asset Links (untuk APK TWA)
    location /.well-known/assetlinks.json {
        alias /var/www/bmt-maal/static/assetlinks.json;
        add_header Content-Type application/json;
    }

    # App
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
}
