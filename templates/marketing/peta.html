{% extends 'marketing/base.html' %}
{% block title %}Peta Fundraising{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2">
  <div class="fw-bold fs-5">Peta Fundraising</div>
  <div class="small text-muted">{{ bulan }}</div>
</div>
<div class="d-flex gap-2 mb-2 small align-items-center">
  <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#3498db;border:2px solid #fff"></span> Belum</span>
  <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#e67e22;border:2px solid #fff"></span> Tidak Ada</span>
  <label class="ms-auto d-flex align-items-center gap-1 mb-0" style="cursor:pointer">
    <input type="checkbox" id="tgHull" checked> Cakupan desa
  </label>
</div>
<div class="card p-0 overflow-hidden" style="border-radius:12px">
  <div id="map" style="height:calc(100vh - 210px);min-height:400px"></div>
</div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
const titik = {{ titik_json | safe }};
const desaPoints = {{ desa_json | safe }};
const map = L.map('map').setView([-7.812, 110.923], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

// ── Lapisan cakupan desa (hull) ──
const hullLayer = L.layerGroup().addTo(map);
function desaColor(name){
  if(!name) return '#95a5a6';
  let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))%360;
  return `hsl(${h},65%,45%)`;
}
function buildHulls(){
  hullLayer.clearLayers();
  if(!document.getElementById('tgHull').checked) return;
  const groups={};
  desaPoints.forEach(d=>{ if(d.lat&&d.lng&&d.desa) (groups[d.desa]=groups[d.desa]||[]).push(d); });
  Object.entries(groups).forEach(([desa,pts])=>{
    const color=desaColor(desa);
    if(pts.length>=3){
      const hull=turf.convex(turf.featureCollection(pts.map(p=>turf.point([p.lng,p.lat]))));
      if(hull){ L.geoJSON(hull,{style:{color,weight:2,fillColor:color,fillOpacity:0.10}})
        .bindTooltip(`${desa} (${pts.length})`,{sticky:true}).addTo(hullLayer); return; }
    }
    const lat=pts.reduce((s,p)=>s+p.lat,0)/pts.length, lng=pts.reduce((s,p)=>s+p.lng,0)/pts.length;
    L.circle([lat,lng],{radius:160,color,weight:2,fillColor:color,fillOpacity:0.10})
      .bindTooltip(`${desa} (${pts.length})`,{sticky:true}).addTo(hullLayer);
  });
}
document.getElementById('tgHull').addEventListener('change', buildHulls);
buildHulls();

function makeIcon(color) {
  return L.divIcon({
    className:'',
    html:`<div style="background:${color};width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`,
    iconSize:[14,14],iconAnchor:[7,7],popupAnchor:[0,-10]
  });
}

titik.forEach(t => {
  const color = t.status === 'tidak_ada' ? '#e67e22' : '#3498db';
  const label = t.sumber_infaq === 'kencleng' ? '🏠 Kencleng' : '🕌 Kotak';
  const kunjungan = t.jumlah_kunjungan > 0
    ? `<div style="font-size:.75rem;color:#e67e22">⚠ ${t.jumlah_kunjungan}x tidak ada</div>` : '';
  L.marker([t.lat, t.lng], {icon: makeIcon(color)})
   .bindPopup(`
     <div style="min-width:160px">
       <div style="font-weight:700">${t.nama}</div>
       <div style="font-size:.8rem;color:#666">${t.lokasi_nama||''}</div>
       <div style="font-size:.8rem;color:#888;margin-bottom:4px">${t.area||''}</div>
       <div style="font-size:.8rem">${label}</div>
       ${kunjungan}
       <a href="/marketing/koleksi/${t.id}"
          style="display:block;margin-top:8px;background:#2980b9;color:#fff;
                 padding:4px 8px;border-radius:6px;text-align:center;
                 font-size:.8rem;text-decoration:none">Catat Fundraising</a>
     </div>
   `).addTo(map);
});

if (titik.length > 0) {
  map.fitBounds(titik.map(t=>[t.lat,t.lng]), {padding:[30,30]});
}
</script>
{% endblock %}
